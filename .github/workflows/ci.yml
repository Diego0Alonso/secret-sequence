name: CI

# Validation gate for every push to main and every pull request.
# This workflow has NO secrets and NO id-token: it only installs,
# builds and runs the test suite. There is nothing here to steal.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm run build

      # explicit type-check (react resolves core's emitted types from dist)
      - run: pnpm typecheck

      - run: pnpm test

  # Both packages declare engines.node ">=18", but the dev toolchain (pnpm 11.5
  # needs Node >= 22.13) cannot install on older majors. So build on 22 and
  # smoke-test the BUILT core engine (zero runtime deps) on each supported major
  # to actually back the engines claim.
  smoke-core:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # Build with the toolchain's required Node (22).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter secret-sequence-core build

      # Switch to the target major and run the built artifacts there.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Smoke-test built core (ESM + CJS) on Node ${{ matrix.node }}
        run: |
          node --input-type=module -e "
            import { SecretSequenceEngine, detectSwipe } from './packages/core/dist/index.mjs'
            new SecretSequenceEngine({ sequences: [{ sequence: ['up'], onSuccess() {} }] })
            if (detectSwipe({ x: 0, y: 0, time: 0 }, { x: 100, y: 0, time: 100 }) !== 'right') throw new Error('ESM detectSwipe failed')
            console.log('ESM core smoke OK on ' + process.version)
          "
          node -e "
            const { SecretSequenceEngine, detectSwipe } = require('./packages/core/dist/index.js')
            new SecretSequenceEngine({ sequences: [{ sequence: ['up'], onSuccess() {} }] })
            if (detectSwipe({ x: 0, y: 0, time: 0 }, { x: 100, y: 0, time: 100 }) !== 'right') throw new Error('CJS detectSwipe failed')
            console.log('CJS core smoke OK on ' + process.version)
          "

  # Require a changeset on PRs that touch published packages, so every
  # user-facing change carries its own version bump + changelog entry.
  # Skipped for the bot-authored "Version Packages" PR, which consumes
  # (deletes) changesets rather than adding them.
  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need history to diff against the base branch

      - name: Require a changeset when packages/** changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"

          pkg_changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'packages/**' | wc -l)
          # Exclude the changesets README via a git pathspec (not grep): a grep
          # over empty input exits 1 and would trip `set -o pipefail`.
          changesets_added=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- '.changeset/*.md' ':(exclude).changeset/README.md' | wc -l)

          echo "packages/** files changed: $pkg_changed"
          echo "changeset files added:    $changesets_added"

          if [ "$pkg_changed" -gt 0 ] && [ "$changesets_added" -eq 0 ]; then
            echo "::error::This PR changes packages/** but adds no changeset. Run 'pnpm changeset' to describe the release, or 'pnpm changeset --empty' to intentionally skip one."
            exit 1
          fi

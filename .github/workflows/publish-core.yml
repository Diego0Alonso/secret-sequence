name: Publish Core

# Triggered by pushing a tag like: core-v2.0.2
# Publishes the version currently in packages/core/package.json
# (the tag only triggers the run — npm publishes whatever the tagged
# commit has in package.json, so bump the version BEFORE tagging).
on:
  push:
    tags:
      - "core-v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    # OIDC Trusted Publishing: no NPM_TOKEN required.
    # id-token: write is what lets npm prove this run's identity to the
    # registry and generate provenance attestations.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # pnpm publish delegates to the system `npm publish`, so OIDC Trusted
      # Publishing needs a recent npm (>= 11.5.1) available on the runner.
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Gate: the whole monorepo must be green before publishing
      - run: pnpm test

      - name: Publish secret-sequence-core
        run: pnpm --filter secret-sequence-core publish --no-git-checks --provenance --access public
